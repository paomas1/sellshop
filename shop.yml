# ============================================================
#  KyunShop - shop.yml
# ============================================================
#  /shop menüsündeki kategoriler ve ürünler burada.
#  Format:   MATERYAL: alış fiyatı   (oyuncunun shop'tan alırken ödediği)
#  "sell:" bölümü ise /sell ile satarken verilen fiyatlar.
#
#  Yeni kategori eklemek için "categories:" altına yeni blok yaz
#  (örn. "redstone" bloğunu kopyala). Ya da oyunda:
#     /shopadmin addcategory <id>          (elindeki eşya ikon olur)
#     /shopadmin additem <id> <fiyat> [satis]   (elindeki eşyayı ekler)
#  Değişiklikten sonra: /shopadmin reload
#  Fiyatlarda 1k, 2.5m, 1b gibi kısaltmalar komutlarda kullanılabilir.
# ============================================================

